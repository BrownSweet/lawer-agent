[project]
name = "law_backend"
version = "0.1.0"
description = "Chinese legal workspace with CrewAI, MySQL and COS"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai==1.15.22",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "pymysql[rsa]>=1.1,<2",
    "cryptography>=44",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20",
    "pymupdf>=1.25,<2",
    "pillow>=11,<13",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.13,<5",
    "itsdangerous>=2.2,<3",
    "cos-python-sdk-v5>=1.9,<2",
    "mcp>=1.26,<3",
    "alembic>=1.15,<2",
]

[project.scripts]
law-worker = "law_backend.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
