name: lawer-workspace
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3318}:3306"
    environment:
      MYSQL_DATABASE: law_workspace
      MYSQL_USER: law_workspace
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/setup.py first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup.py first}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  mysql_data:
