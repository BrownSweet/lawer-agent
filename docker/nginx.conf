map $http_x_forwarded_proto $lawer_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80 default_server;
    server_name _;
    root /app/frontend/dist;
    absolute_redirect off;
    client_max_body_size 50M;

    location = / {
        return 308 /lawer/$is_args$args;
    }
    location = /lawer {
        return 308 /lawer/$is_args$args;
    }
    location = /lawer/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # 外部代理保留 /lawer/，这里只剥离一次。
    location ^~ /lawer/api/ {
        proxy_pass http://127.0.0.1:8891/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lawer_forwarded_proto;
        proxy_set_header Connection "";
        proxy_cookie_path ~^/$ /lawer/;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location ^~ /lawer/assets/ {
        rewrite ^/lawer/(.*)$ /$1 break;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /lawer/ {
        rewrite ^/lawer/(.*)$ /$1 break;
        try_files $uri /lawer/index.html;
        add_header Cache-Control "no-cache";
    }
    location / {
        return 404;
    }
}
